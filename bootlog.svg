<svg xmlns="http://www.w3.org/2000/svg" width="900" height="243" viewBox="0 0 900 243" role="img" aria-label="bootlog">
<defs><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern></defs>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace}.cv{transform-box:fill-box;transform-origin:100% 50%}.cur,.bk{opacity:0}@keyframes vis{0%{opacity:1}99%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fi .35s ease-out forwards}@keyframes fi{to{opacity:1}}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}.pu{animation:pu 2s ease-in-out infinite}@keyframes dsh{to{stroke-dashoffset:-16}}.dash{stroke-dasharray:5 5;animation:dsh .8s linear infinite}@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:gr .9s ease-out forwards}</style>
<rect width="900" height="243" fill="#0a0a0a" rx="10"/>
<rect x=".5" y=".5" width="899" height="242" rx="10" fill="#0d1410" stroke="#1f2a22"/>
<rect x=".5" y=".5" width="899" height="34" rx="10" fill="#111a14"/>
<rect x=".5" y="20" width="899" height="14.5" fill="#111a14"/>
<line x1="1" y1="34.5" x2="899" y2="34.5" stroke="#1f2a22"/>
<circle cx="22" cy="17.5" r="6" fill="#ff5f56"/><circle cx="42" cy="17.5" r="6" fill="#ffbd2e"/><circle cx="62" cy="17.5" r="6" fill="#27c93f"/>
<text x="450.0" y="22" font-size="12" fill="#5c6370" text-anchor="middle">dmesg | tail  —  boot log</text>
<g class="f" style="animation-delay:0.30s">
<text x="30.0" y="76.0" font-size="15" fill="#00ff41" font-weight="700" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >[ OK ]</text>
<text x="93.0" y="76.0" font-size="15" fill="#cfd8d2" font-weight="400" textLength="405.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >booting numaan-os (data-science + web kernel)</text>
</g>
<g class="f" style="animation-delay:0.80s">
<text x="30.0" y="103.0" font-size="15" fill="#00ff41" font-weight="700" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >[ OK ]</text>
<text x="93.0" y="103.0" font-size="15" fill="#cfd8d2" font-weight="400" textLength="378.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >mounted /dev/skills/python /dev/skills/git</text>
</g>
<g class="f" style="animation-delay:1.30s">
<text x="30.0" y="130.0" font-size="15" fill="#00ff41" font-weight="700" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >[ OK ]</text>
<text x="93.0" y="130.0" font-size="15" fill="#cfd8d2" font-weight="400" textLength="405.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >started docker.service (run, ps, start, -dit)</text>
</g>
<g class="f" style="animation-delay:1.80s">
<text x="30.0" y="157.0" font-size="15" fill="#ffd866" font-weight="700" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" class="pu">[ .. ]</text>
<text x="93.0" y="157.0" font-size="15" fill="#cfd8d2" font-weight="400" textLength="432.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >loading linux, bash, dockerfiles, github-actions</text>
</g>
<g class="f" style="animation-delay:2.30s">
<text x="30.0" y="184.0" font-size="15" fill="#8b95a1" font-weight="700" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >[WAIT]</text>
<text x="93.0" y="184.0" font-size="15" fill="#8b95a1" font-weight="400" textLength="387.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >aws, terraform, ansible, kubernetes: queued</text>
</g>
<g class="f" style="animation-delay:2.80s">
<text x="30.0" y="215.0" font-size="15" fill="#00ff41" font-weight="700" textLength="117.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >numaan@ubuntu</text>
<text x="147.0" y="215.0" font-size="15" fill="#cfd8d2" font-weight="400" textLength="9.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >:</text>
<text x="156.0" y="215.0" font-size="15" fill="#00e5ff" font-weight="400" textLength="9.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >~</text>
<text x="165.0" y="215.0" font-size="15" fill="#00ff41" font-weight="700" textLength="9.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$</text>
</g>
<rect class="bk" x="183.0" y="200.8" width="8.2" height="18.0" fill="#00ff41" style="animation:bl 1.1s step-end 2.80s infinite"/>
<rect width="900" height="243" fill="url(#scan)" rx="10" pointer-events="none"/>
</svg>