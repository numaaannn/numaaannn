<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-label="Numaan Opai DevOps skills status terminal">
  <title>Numaan Opai — DevOps Skills Status</title>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset=".82" stop-color="#16C60C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#CFFFD8" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00FF41" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78">
      <stop offset=".48" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity=".78"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: 'Cascadia Mono','Consolas','DejaVu Sans Mono','Courier New',monospace;
      }
      .rain { animation: fall linear infinite; }
      @keyframes fall {
        from { transform: translateY(-210px); }
        to { transform: translateY(410px); }
      }
      .scan { animation: sweep 6s linear infinite; }
      @keyframes sweep {
        from { transform: translateY(-40px); }
        to { transform: translateY(410px); }
      }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 1.7s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .3; } }
      .glitch1 { animation: glitch1 7s infinite; opacity: 0; }
      .glitch2 { animation: glitch2 7s infinite; opacity: 0; }
      @keyframes glitch1 {
        0%,91%,100% { opacity: 0; transform: translate(0,0); }
        92% { opacity: .8; transform: translate(-2px,1px); }
        94% { opacity: .8; transform: translate(2px,-1px); }
        96% { opacity: 0; }
      }
      @keyframes glitch2 {
        0%,92%,100% { opacity: 0; transform: translate(0,0); }
        93% { opacity: .7; transform: translate(2px,-1px); }
        95% { opacity: .7; transform: translate(-2px,1px); }
        97% { opacity: 0; }
      }
      @media (prefers-reduced-motion:reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="390" rx="10" fill="#0A0A0A"/>

  <!-- Matrix rain -->
  <g fill="#00FF41" opacity=".62" font-size="13">
    <text class="rain" x="18" y="0" style="animation-duration:12s;animation-delay:-7s">#<tspan x="18" dy="16">1</tspan><tspan x="18" dy="16">A</tspan><tspan x="18" dy="16">;</tspan><tspan x="18" dy="16">0</tspan><tspan x="18" dy="16">F</tspan><tspan x="18" dy="16">}</tspan><tspan x="18" dy="16">C</tspan><tspan x="18" dy="16">7</tspan><tspan x="18" dy="16">/</tspan><tspan x="18" dy="16">E</tspan></text>
    <text class="rain" x="49" y="0" style="animation-duration:9.5s;animation-delay:-3s">0<tspan x="49" dy="16">B</tspan><tspan x="49" dy="16">/</tspan><tspan x="49" dy="16">E</tspan><tspan x="49" dy="16">1</tspan><tspan x="49" dy="16">#</tspan><tspan x="49" dy="16">D</tspan><tspan x="49" dy="16">;</tspan><tspan x="49" dy="16">A</tspan></text>
    <text class="rain" x="80" y="0" style="animation-duration:11s;animation-delay:-5s">C<tspan x="80" dy="16">}</tspan><tspan x="80" dy="16">4</tspan><tspan x="80" dy="16">A</tspan><tspan x="80" dy="16">0</tspan><tspan x="80" dy="16">/</tspan><tspan x="80" dy="16">F</tspan><tspan x="80" dy="16">#</tspan><tspan x="80" dy="16">2</tspan></text>
    <text class="rain" x="111" y="0" style="animation-duration:13s;animation-delay:-9s">E<tspan x="111" dy="16">1</tspan><tspan x="111" dy="16">D</tspan><tspan x="111" dy="16">;</tspan><tspan x="111" dy="16">9</tspan><tspan x="111" dy="16">B</tspan><tspan x="111" dy="16">/</tspan><tspan x="111" dy="16">0</tspan></text>
    <text class="rain" x="889" y="0" style="animation-duration:10s;animation-delay:-4s">A<tspan x="889" dy="16">#</tspan><tspan x="889" dy="16">0</tspan><tspan x="889" dy="16">C</tspan><tspan x="889" dy="16">}</tspan><tspan x="889" dy="16">1</tspan><tspan x="889" dy="16">E</tspan><tspan x="889" dy="16">/</tspan><tspan x="889" dy="16">D</tspan></text>
    <text class="rain" x="920" y="0" style="animation-duration:12.5s;animation-delay:-8s">7<tspan x="920" dy="16">F</tspan><tspan x="920" dy="16">;</tspan><tspan x="920" dy="16">A</tspan><tspan x="920" dy="16">3</tspan><tspan x="920" dy="16">/</tspan><tspan x="920" dy="16">C</tspan><tspan x="920" dy="16">}</tspan></text>
    <text class="rain" x="951" y="0" style="animation-duration:9s;animation-delay:-2s">D<tspan x="951" dy="16">0</tspan><tspan x="951" dy="16">E</tspan><tspan x="951" dy="16">#</tspan><tspan x="951" dy="16">B</tspan><tspan x="951" dy="16">;</tspan><tspan x="951" dy="16">1</tspan><tspan x="951" dy="16">A</tspan></text>
    <text class="rain" x="982" y="0" style="animation-duration:11.8s;animation-delay:-6s">1<tspan x="982" dy="16">C</tspan><tspan x="982" dy="16">/</tspan><tspan x="982" dy="16">0</tspan><tspan x="982" dy="16">E</tspan><tspan x="982" dy="16">}</tspan><tspan x="982" dy="16">A</tspan></text>
  </g>

  <rect width="1000" height="390" rx="10" fill="url(#vignette)"/>

  <!-- Neon frame -->
  <rect x="1" y="1" width="998" height="388" rx="9"
        fill="none" stroke="#16C60C" stroke-opacity=".65" stroke-width="1.5"/>
  <g fill="none" stroke="#00FF41" stroke-width="2" stroke-linecap="round">
    <path d="M12 34V12H34"/>
    <path d="M966 12H988V34"/>
    <path d="M12 356V378H34"/>
    <path d="M966 378H988V356"/>
  </g>

  <!-- Header -->
  <text x="48" y="29" font-size="12" fill="#16C60C">&gt; junior.devops --skills-status</text>
  <circle class="pulse" cx="835" cy="25" r="4" fill="#00FF41"/>
  <text x="848" y="29" font-size="12" fill="#16C60C">ALL_SYSTEMS_OK</text>

  <rect class="scan" x="0" y="0" width="1000" height="42" fill="url(#scan)"/>

  <!-- Terminal window -->
  <rect x="135" y="43" width="730" height="304" rx="9"
        fill="#080D0B" fill-opacity=".97" stroke="#24452F" stroke-width="1.2"/>
  <rect x="135" y="43" width="730" height="29" rx="9" fill="#121812"/>
  <rect x="135" y="59" width="730" height="13" fill="#121812"/>

  <!-- Window controls -->
  <circle cx="154" cy="57" r="4.5" fill="#FF5F56" fill-opacity=".9"/>
  <circle cx="170" cy="57" r="4.5" fill="#FFBD2E" fill-opacity=".9"/>
  <circle cx="186" cy="57" r="4.5" fill="#27C93F" fill-opacity=".9"/>

  <text x="500" y="61" font-size="11" fill="#5C6370" text-anchor="middle">
    numaan@NumaansLaptop: ~/skills
  </text>

  <!-- Terminal command -->
  <text x="160" y="96" font-size="14">
    <tspan fill="#16C60C">numaan@NumaansLaptop</tspan><tspan fill="#CCCCCC">:</tspan><tspan fill="#3B78FF">~/skills</tspan><tspan fill="#CCCCCC">$ ./verify-all --status</tspan>
  </text>

  <text x="160" y="119" font-size="11" fill="#5C6370">
    SKILL INVENTORY <tspan fill="#16C60C">/</tspan> STATUS: <tspan fill="#16C60C">PRACTICED</tspan>
  </text>
  <line x1="160" y1="130" x2="840" y2="130" stroke="#26382B"/>

  <!-- Skills: left column -->
  <g font-size="13.5">
    <text x="160" y="153"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Git</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="160" y="177"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> GitHub</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="160" y="201"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Python</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="160" y="225"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Linux + Networking</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="160" y="249"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Bash Scripting</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="160" y="273"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Docker + Dockerfiles</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="160" y="297"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> GitHub Actions + CI/CD</tspan><tspan fill="#16C60C"> · practiced</tspan></text>

    <!-- Skills: right column -->
    <text x="515" y="153"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> AWS</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="515" y="177"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Terraform</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="515" y="201"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Ansible</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="515" y="225"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Kubernetes</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="515" y="249"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Jenkins</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="515" y="273"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Monitoring + Logging</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
    <text x="515" y="297"><tspan fill="#00FF41" font-weight="700">[ OK ]</tspan><tspan fill="#D7E2D9"> Docker Images</tspan><tspan fill="#16C60C"> · practiced</tspan></text>
  </g>

  <!-- Footer -->
  <line x1="160" y1="312" x2="840" y2="312" stroke="#26382B"/>
  <text x="160" y="333" font-size="11" fill="#5C6370">
    # [ OK ] = practiced  •  DevOps / CloudOps learning inventory
  </text>
  <text x="500" y="371" font-size="12" fill="#5C6370" text-anchor="middle">
    linux • docker • ci/cd • aws • automation • cloud infrastructure
  </text>
  <text x="160" y="333" font-size="13" xml:space="preserve" opacity="0">
    <tspan fill="#16C60C">numaan@NumaansLaptop</tspan><tspan fill="#CCCCCC">:~$</tspan><tspan class="blink" fill="#00FF41"> █</tspan>
  </text>
</svg>
