```svg
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="316"
     viewBox="0 0 1000 316"
     role="img"
     aria-label="Animated boot log terminal for Numaan Opai">

  <title>Boot Log — Numaan Opai</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110a"/>
      <stop offset="1" stop-color="#030605"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screen">
      <rect x="2" y="2" width="996" height="312" rx="10"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: 'Cascadia Mono', 'Consolas',
                   'DejaVu Sans Mono', monospace;
    }

    .muted { fill: #63816b; }
    .green { fill: #16c60c; }
    .bright { fill: #00ff41; }
    .cyan { fill: #00e5ff; }
    .white { fill: #d7e5d9; }

    .log {
      opacity: 0;
      animation: appear 12s linear infinite;
    }

    .l1 { animation-delay: .3s; }
    .l2 { animation-delay: 1.1s; }
    .l3 { animation-delay: 1.9s; }
    .l4 { animation-delay: 2.7s; }
    .l5 { animation-delay: 3.5s; }
    .l6 { animation-delay: 4.3s; }
    .l7 { animation-delay: 5.1s; }

    @keyframes appear {
      0%, 4% {
        opacity: 0;
        transform: translateY(4px);
      }
      8%, 82% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cursor {
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .scan {
      animation: scan 5s linear infinite;
    }

    @keyframes scan {
      from { transform: translateY(-320px); }
      to   { transform: translateY(320px); }
    }

    .rain {
      animation: fall 7s linear infinite;
    }

    @keyframes fall {
      from { transform: translateY(-90px); }
      to   { transform: translateY(340px); }
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .log, .cursor, .scan, .rain, .pulse {
        animation: none !important;
      }

      .log { opacity: 1; }
    }
  </style>

  <g clip-path="url(#screen)">

    <!-- Background -->
    <rect width="1000" height="316" fill="url(#bg)"/>

    <!-- Animated Matrix rain -->
    <g class="rain" opacity=".14" fill="#00ff41" font-size="12">
      <text x="40" y="45">1 0 1 1 0 0 1 0 1</text>
      <text x="40" y="85">0 1 0 1 1 0 0 1 0</text>
      <text x="40" y="125">1 1 0 0 1 0 1 1 0</text>

      <text x="820" y="35">0 1 1 0 1 0 0</text>
      <text x="820" y="75">1 0 0 1 0 1 1</text>
      <text x="820" y="115">0 1 1 1 0 0 1</text>
    </g>

    <!-- Terminal header -->
    <rect x="1" y="1" width="998" height="30"
          rx="9" fill="#101a12"/>
    <rect x="1" y="17" width="998" height="14"
          fill="#101a12"/>

    <circle cx="22" cy="16" r="4.5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="4.5" fill="#ffbd2e"/>
    <circle cx="54" cy="16" r="4.5" fill="#27c93f"/>

    <text x="500" y="20"
          text-anchor="middle"
          font-size="11"
          class="muted">
      boot.log — numaan@NumaansLaptop
    </text>

    <!-- Boot command -->
    <text x="28" y="58" font-size="14">
      <tspan class="green">numaan@NumaansLaptop</tspan>
      <tspan class="white">:~$ ./bootlog --init</tspan>
    </text>

    <text x="28" y="84" font-size="13" class="muted">
      [  0.000 ] Initializing Numaan's DevOps workspace...
    </text>

    <!-- Animated boot messages -->
    <g class="log l1" font-size="13">
      <text x="28" y="108">
        <tspan class="green">[  OK  ]</tspan>
        <tspan class="white"> Loading Linux fundamentals</tspan>
      </text>
    </g>

    <g class="log l2" font-size="13">
      <text x="28" y="132">
        <tspan class="green">[  OK  ]</tspan>
        <tspan class="white"> Checking networking toolkit</tspan>
      </text>
    </g>

    <g class="log l3" font-size="13">
      <text x="28" y="156">
        <tspan class="green">[  OK  ]</tspan>
        <tspan class="white"> Mounting Git and GitHub workflow</tspan>
      </text>
    </g>

    <g class="log l4" font-size="13">
      <text x="28" y="180">
        <tspan class="cyan">[ BUSY ]</tspan>
        <tspan class="white"> Practicing Docker and Bash scripting</tspan>
      </text>
    </g>

    <g class="log l5" font-size="13">
      <text x="28" y="204">
        <tspan class="cyan">[ BUSY ]</tspan>
        <tspan class="white"> Building CI/CD and cloud foundations</tspan>
      </text>
    </g>

    <g class="log l6" font-size="13">
      <text x="28" y="228">
        <tspan class="green">[ READY ]</tspan>
        <tspan class="white"> Learning mode: active</tspan>
      </text>
    </g>

    <g class="log l7" font-size="13">
      <text x="28" y="252">
        <tspan class="green">[ READY ]</tspan>
        <tspan class="white"> Target: Junior DevOps / CloudOps</tspan>
      </text>
    </g>

    <!-- Status footer -->
    <text x="28" y="282" font-size="12" class="muted">
      BOOT STATUS:
      <tspan class="bright" filter="url(#glow)">ONLINE</tspan>
      <tspan> // LEARN • BUILD • TROUBLESHOOT • REPEAT</tspan>
    </text>

    <!-- Blinking terminal cursor -->
    <text x="28" y="303" font-size="13">
      <tspan class="green">numaan@NumaansLaptop</tspan>
      <tspan class="white">:~$</tspan>
      <tspan class="bright cursor"> █</tspan>
    </text>

    <!-- Animated scanline -->
    <rect class="scan"
          x="0" y="0"
          width="1000" height="2"
          fill="#00ff41"
          opacity=".35"/>

    <!-- Neon border -->
    <rect x="1" y="1"
          width="998" height="314"
          rx="10"
          fill="none"
          stroke="#16c60c"
          stroke-opacity=".65"
          stroke-width="1.5"/>

    <!-- Corner details -->
    <path d="M12 38V12H38
             M962 12H988V38
             M12 278V304H38
             M962 304H988V278"
          fill="none"
          stroke="#00ff41"
          stroke-width="1.5"
          opacity=".8"/>

    <!-- Status indicator -->
    <circle class="pulse"
            cx="971" cy="57" r="3"
            fill="#00ff41"/>

  </g>
</svg>
```
