<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Detailed skills</title>
  <desc id="desc">Programming, web and APIs, AI and data, machine learning methods, data tools, and cloud and DevOps fundamentals.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1b2a3d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".075"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#88a7ff" stop-opacity=".075"/>
      <stop offset="1" stop-color="#88a7ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel-clip"><rect width="1000" height="420" rx="20"/></clipPath>
  </defs>
  <style>
    @keyframes soft-pulse { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }
    .pulse { animation: soft-pulse 5.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .pulse animate { display: none; } }
  </style>
  <rect width="1000" height="420" rx="20" fill="url(#panel)"/>
  <g clip-path="url(#panel-clip)">
    <circle cx="890" cy="40" r="240" fill="url(#aura)"/>
    <circle cx="120" cy="420" r="240" fill="url(#aura)"/>
  </g>
  <text x="38" y="39" fill="#9fb0c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">SKILLS AT A GLANCE</text>
  <circle class="pulse" cx="962" cy="35" r="4" fill="#55d6be">
    <animate attributeName="r" values="3;4.8;3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <path d="M38 53H962" stroke="#ffffff" stroke-opacity=".1"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="36" y="68" width="452" height="98" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="36" y="68" width="3" height="98" rx="1.5" fill="#55d6be" fill-opacity=".72"/>
    <path d="M50 69H474" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="58" y="96" fill="#55d6be" font-size="11" font-weight="700" letter-spacing="1.2">PROGRAMMING</text>
    <text x="58" y="128" fill="#e4ebf4" font-size="14">Python · Java (basics) · JavaScript · SQL · HTML5 · CSS3</text>

    <rect x="512" y="68" width="452" height="98" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="512" y="68" width="3" height="98" rx="1.5" fill="#88a7ff" fill-opacity=".72"/>
    <path d="M526 69H950" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="534" y="96" fill="#a9bcff" font-size="11" font-weight="700" letter-spacing="1.2">WEB &amp; APIs</text>
    <text x="534" y="126" fill="#e4ebf4" font-size="14">React · Next.js · Node.js · Express.js</text>
    <text x="534" y="148" fill="#e4ebf4" font-size="14">REST APIs · Tailwind CSS</text>

    <rect x="36" y="178" width="452" height="98" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="36" y="178" width="3" height="98" rx="1.5" fill="#d6b779" fill-opacity=".72"/>
    <path d="M50 179H474" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="58" y="206" fill="#e2c88f" font-size="11" font-weight="700" letter-spacing="1.2">AI &amp; DATA</text>
    <text x="58" y="236" fill="#e4ebf4" font-size="14">TensorFlow · Keras · scikit-learn · Pandas · NumPy</text>
    <text x="58" y="258" fill="#e4ebf4" font-size="14">LLM APIs · Prompt design · EDA</text>

    <rect x="512" y="178" width="452" height="98" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="512" y="178" width="3" height="98" rx="1.5" fill="#d6b779" fill-opacity=".65"/>
    <path d="M526 179H950" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="534" y="206" fill="#e2c88f" font-size="11" font-weight="700" letter-spacing="1.2">MACHINE LEARNING METHODS</text>
    <text x="534" y="239" fill="#e4ebf4" font-size="14">Regression · Classification · K-Means · PCA</text>

    <rect x="36" y="288" width="452" height="98" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="36" y="288" width="3" height="98" rx="1.5" fill="#55d6be" fill-opacity=".65"/>
    <path d="M50 289H474" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="58" y="316" fill="#55d6be" font-size="11" font-weight="700" letter-spacing="1.2">DATABASES &amp; TOOLS</text>
    <text x="58" y="346" fill="#e4ebf4" font-size="14">MySQL · Jupyter Notebook · Google Colab</text>
    <text x="58" y="368" fill="#e4ebf4" font-size="14">Streamlit · Vercel</text>

    <rect x="512" y="288" width="452" height="98" rx="12" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="512" y="288" width="3" height="98" rx="1.5" fill="#88a7ff" fill-opacity=".65"/>
    <path d="M526 289H950" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="534" y="316" fill="#a9bcff" font-size="11" font-weight="700" letter-spacing="1.2">CLOUD &amp; DEVOPS FUNDAMENTALS</text>
    <text x="534" y="346" fill="#e4ebf4" font-size="14">Linux · Git · GitHub · Docker · AWS fundamentals</text>
    <text x="534" y="368" fill="#e4ebf4" font-size="14">Networking · Bash</text>
  </g>
</svg>
