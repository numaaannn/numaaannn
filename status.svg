<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 126" role="img" aria-labelledby="title desc">
  <title id="title">Three connected skill areas</title>
  <desc id="desc">AI and data, full-stack web development, and cloud and DevOps fundamentals.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1b2a3d"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes soft-pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .pulse { animation: soft-pulse 5.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <rect x="1" y="1" width="998" height="124" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".12"/>
  <path d="M334 18V108M667 18V108" stroke="#ffffff" stroke-opacity=".1"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle class="pulse" style="animation-delay:0s" cx="39" cy="42" r="4" fill="#55d6be"/>
    <text x="54" y="46" fill="#55d6be" font-size="11" font-weight="700" letter-spacing="1.5">01  /  INTELLIGENCE</text>
    <text x="28" y="79" fill="#f4f7fb" font-size="19" font-weight="700">AI &amp; Data</text>
    <text x="28" y="101" fill="#9fb0c6" font-size="12">Machine learning · analysis · LLMs</text>

    <circle class="pulse" style="animation-delay:1.5s" cx="373" cy="42" r="4" fill="#88a7ff"/>
    <text x="388" y="46" fill="#a9bcff" font-size="11" font-weight="700" letter-spacing="1.5">02  /  APPLICATIONS</text>
    <text x="362" y="79" fill="#f4f7fb" font-size="19" font-weight="700">Full-Stack Web</text>
    <text x="362" y="101" fill="#9fb0c6" font-size="12">Frontend · backend · REST APIs</text>

    <circle class="pulse" style="animation-delay:3s" cx="706" cy="42" r="4" fill="#d6b779"/>
    <text x="721" y="46" fill="#e2c88f" font-size="11" font-weight="700" letter-spacing="1.5">03  /  DELIVERY</text>
    <text x="695" y="79" fill="#f4f7fb" font-size="19" font-weight="700">Cloud &amp; DevOps</text>
    <text x="695" y="101" fill="#9fb0c6" font-size="12">Linux · containers · cloud fundamentals</text>
  </g>
</svg>
