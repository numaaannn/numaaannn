<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 112" role="img" aria-labelledby="title desc">
  <title id="title">Availability, role, experience level, and portfolio</title>
  <desc id="desc">Open to work, junior DevOps developer, entry level, visit portfolio.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity=".75"/>
      <stop offset=".52" stop-color="#163322" stop-opacity=".75"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff41" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel">
      <path d="M18 8H982L992 18V94L982 104H18L8 94V18Z"/>
    </clipPath>
  </defs>
  <path d="M18 8H982L992 18V94L982 104H18L8 94V18Z" fill="#080c0a" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M18 12H982L988 18V94L982 100H18L12 94V18Z" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g clip-path="url(#panel)">
    <path d="M256 8V104M500 8V104M744 8V104" stroke="#26352b" stroke-width="1"/>
    <path d="M34 20V32M34 20H46M966 20V32M966 20H954" fill="none" stroke="#00ff41" stroke-opacity=".65"/>
    <path d="M34 92V80M34 92H46M966 92V80M966 92H954" fill="none" stroke="#00e5ff" stroke-opacity=".65"/>
    <rect x="-110" y="8" width="110" height="96" fill="url(#scan)">
      <animate attributeName="x" from="-110" to="1000" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g font-family="'Cascadia Mono',Consolas,monospace">
    <text x="44" y="42" fill="#82958a" font-size="10" letter-spacing="1.8">AVAILABILITY</text>
    <circle cx="50" cy="70" r="4" fill="#00ff41"/>
    <circle cx="50" cy="70" r="7" fill="none" stroke="#00ff41" stroke-opacity=".45">
      <animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="76" fill="#d9ffe2" font-size="16" font-weight="700" letter-spacing=".5">OPEN TO WORK</text>

    <text x="278" y="42" fill="#8295a0" font-size="10" letter-spacing="1.8">ROLE</text>
    <path d="M278 65L284 71L278 77" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="296" y="76" fill="#d8faff" font-size="16" font-weight="700" letter-spacing=".5">JUNIOR DEVOPS</text>

    <text x="522" y="42" fill="#82958a" font-size="10" letter-spacing="1.8">EXPERIENCE</text>
    <path d="M522 65L528 71L522 77" fill="none" stroke="#00ff41" stroke-width="1.5"/>
    <text x="540" y="76" fill="#d9ffe2" font-size="16" font-weight="700" letter-spacing=".5">ENTRY LEVEL</text>

    <text x="766" y="42" fill="#8295a0" font-size="10" letter-spacing="1.8">PORTFOLIO</text>
    <path d="M766 65L772 71L766 77" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="784" y="76" fill="#d8faff" font-size="16" font-weight="700" letter-spacing=".5">VISIT NOW &#8599;</text>
  </g>
</svg>
