<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img" aria-label="footer">
<defs><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".035"/></pattern><pattern id="code" width="73" height="96" patternUnits="userSpaceOnUse"><text x="8" y="14" fill="#00ff41" fill-opacity=".12" font-size="9" font-family="monospace">0</text><text x="8" y="29" fill="#00ff41" fill-opacity=".09" font-size="9" font-family="monospace">1</text><text x="8" y="44" fill="#16c60c" fill-opacity=".09" font-size="9" font-family="monospace">/</text><text x="42" y="62" fill="#00e5ff" fill-opacity=".08" font-size="9" font-family="monospace">1</text><text x="42" y="77" fill="#00ff41" fill-opacity=".1" font-size="9" font-family="monospace">0</text><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 96" dur="3.2s" repeatCount="indefinite"/></pattern></defs>
<style>text{font-family:'Cascadia Mono','Consolas','DejaVu Sans Mono','Courier New',monospace}.cv{transform-box:fill-box;transform-origin:100% 50%}.cur,.bk{opacity:0}@keyframes vis{0%{opacity:1}99%{opacity:1}100%{opacity:0}}.f{opacity:0;animation:fi .35s ease-out forwards}@keyframes fi{to{opacity:1}}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}.pu{animation:pu 2s ease-in-out infinite}@keyframes dsh{to{stroke-dashoffset:-16}}.dash{stroke-dasharray:5 5;animation:dsh .8s linear infinite}@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}.grow{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:gr .9s ease-out forwards}@keyframes k1{to{transform:scaleX(0)}}@keyframes m1{to{transform:translateX(54.0px)}}@keyframes k2{to{transform:scaleX(0)}}@keyframes m2{to{transform:translateX(261.0px)}}</style>
<rect width="900" height="100" fill="#0a0a0a" rx="10"/>
<rect x=".5" y=".5" width="899" height="99" rx="10" fill="#0A0A0A" stroke="#1F2A22"/>
<rect x="1" y="1" width="898" height="98" fill="url(#code)" pointer-events="none"/>
<rect x=".5" y=".5" width="899" height="34" rx="10" fill="#121812"/>
<rect x=".5" y="20" width="899" height="14.5" fill="#121812"/>
<line x1="1" y1="34.5" x2="899" y2="34.5" stroke="#1F2A22"/>
<circle cx="22" cy="17.5" r="6" fill="#ff5f56"/><circle cx="42" cy="17.5" r="6" fill="#ffbd2e"/><circle cx="62" cy="17.5" r="6" fill="#27c93f"/>
<text x="450.0" y="22" font-size="12" fill="#5C6370" text-anchor="middle">bash  —  exit</text>
<g class="f" style="animation-delay:0.30s">
<text x="30.0" y="76.0" font-size="15" fill="#00ff41" font-weight="700" textLength="180.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >numaan@NumaansLaptop</text>
<text x="210.0" y="76.0" font-size="15" fill="#CCCCCC" font-weight="400" textLength="9.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >:</text>
<text x="219.0" y="76.0" font-size="15" fill="#00e5ff" font-weight="400" textLength="9.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >~</text>
<text x="228.0" y="76.0" font-size="15" fill="#00ff41" font-weight="700" textLength="9.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >$</text>
</g>
<text x="246.0" y="76.0" font-size="15" fill="#CCCCCC" font-weight="400" textLength="54.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >exit 0</text>
<rect class="cv" x="244.0" y="61.0" width="60.0" height="21.0" fill="#0A0A0A" style="animation:k1 0.75s steps(6,end) 0.60s forwards"/>
<rect class="cur" x="246.0" y="61.8" width="8.2" height="18.0" fill="#00ff41" style="animation:m1 0.75s steps(6,end) 0.60s forwards,vis 0.75s linear 0.60s forwards"/>
<text x="318.0" y="76.0" font-size="15" fill="#5C6370" font-weight="400" textLength="261.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" ># connection closed. ship it.</text>
<rect class="cv" x="316.0" y="61.0" width="267.0" height="21.0" fill="#0A0A0A" style="animation:k2 1.81s steps(29,end) 1.65s forwards"/>
<rect class="cur" x="318.0" y="61.8" width="8.2" height="18.0" fill="#00ff41" style="animation:m2 1.81s steps(29,end) 1.65s forwards,vis 1.81s linear 1.65s forwards"/>
<rect class="bk" x="583.0" y="61.8" width="8.2" height="18.0" fill="#00ff41" style="animation:bl 1.1s step-end 3.56s infinite"/>
<rect width="900" height="100" fill="url(#scan)" rx="10" pointer-events="none"/>
</svg>